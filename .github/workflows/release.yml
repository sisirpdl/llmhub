name: Internal release

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to release
        required: true
        default: android
        type: choice
        options: [android, ios, both]
      version:
        description: Version already set in the native app metadata (for example 0.1.0)
        required: true
        type: string
      confirm_release:
        description: Type RELEASE to confirm an internal distribution build
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: internal-release-${{ inputs.platform }}
  cancel-in-progress: false

jobs:
  release-preflight:
    name: Release preflight
    if: ${{ inputs.confirm_release == 'RELEASE' }}
    runs-on: ubuntu-latest
    environment: internal-release
    steps:
      - uses: actions/checkout@v4

      - name: Confirm repository and signing prerequisites
        shell: bash
        env:
          PLATFORM: ${{ inputs.platform }}
          VERSION: ${{ inputs.version }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          test -f package.json
          test -f package-lock.json
          test -f .nvmrc
          test -n "$VERSION"

          if [[ "$PLATFORM" == 'android' || "$PLATFORM" == 'both' ]]; then
            test -x android/gradlew
            for secret_name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
              test -n "${!secret_name}" || { echo "Missing required Android signing secret: $secret_name"; exit 1; }
            done
          fi

          if [[ "$PLATFORM" == 'ios' || "$PLATFORM" == 'both' ]]; then
            test -f ios/Podfile
            for secret_name in IOS_CERTIFICATE_BASE64 IOS_CERTIFICATE_PASSWORD IOS_PROVISIONING_PROFILE_BASE64; do
              test -n "${!secret_name}" || { echo "Missing required iOS signing secret: $secret_name"; exit 1; }
            done
          fi

          echo "Preflight passed for $PLATFORM version $VERSION."

# This workflow intentionally stops at preflight until the bare React Native app,
# native signing configuration, and a tested distribution route are committed.
# Add Android/iOS build-and-upload jobs only after signing has been validated on
# a non-production test build. See docs/CI_CD.md.
